<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Court</title>
    <meta name="description" content="A cartoon street basketball court where brands buy bleacher seats, fence banners, wall murals, the big screen, and the court's name." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;800&family=Permanent+Marker&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" aria-label="3D street basketball court. Drag to look around; click a seat, banner, mural, the big screen or center court."></canvas>

    <div id="loading" class="loading" role="status">
      <div class="loading-ball"></div>
      <span id="loading-text">LOADING THE COURT…</span>
    </div>

    <div id="ui">
      <header class="hud-top">
        <div class="title-block">
          <div class="wordmark">STREET COURT</div>
          <h1 id="court-title">The ______ Court</h1>
          <button id="naming-line" class="naming-line" type="button">Naming rights available</button>
        </div>
        <div class="hud-right">
          <div class="chips">
            <span id="chip-sales" class="chip"></span>
            <span id="chip-seats" class="chip"></span>
          </div>
          <div class="toolbar">
            <button id="btn-leaders" class="pbtn" type="button">Leaderboard</button>
            <button id="btn-trailer" class="pbtn" type="button" title="Hide the interface and fly the camera, for recording a teaser (T)">Trailer</button>
            <button id="btn-demo" class="pbtn" type="button" title="Switch between demo brands and the empty launch-day court">Demo: on</button>
          </div>
        </div>
      </header>

      <aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" hidden>
        <button class="panel-close" type="button" aria-label="Close">×</button>
        <div id="panel-body"></div>
      </aside>

      <aside id="leaders" class="panel leaders" aria-label="Leaderboard" hidden>
        <button class="panel-close" type="button" aria-label="Close">×</button>
        <h2>Leaderboard</h2>
        <div id="leaders-body"></div>
      </aside>

      <nav class="tiers" aria-label="What you can buy">
        <button class="tier" data-kind="seat" type="button">
          <span class="tier-name">Seat</span><span class="tier-price">$5</span><span class="tier-desc">A fan in your colors</span>
        </button>
        <button class="tier" data-kind="banner" type="button">
          <span class="tier-name">Banner</span><span class="tier-price">from $25</span><span class="tier-desc">Take any banner for 1.25×</span>
        </button>
        <button class="tier" data-kind="mural" type="button">
          <span class="tier-name">Mural</span><span class="tier-price">from $50</span><span class="tier-desc">Your brand on the wall</span>
        </button>
        <button class="tier" data-kind="screen" type="button">
          <span class="tier-name">Big screen</span><span id="tier-screen-price" class="tier-price">$29/day</span><span class="tier-desc">Own it on launch day</span>
        </button>
        <button class="tier tier-hot" data-kind="naming" type="button">
          <span class="tier-name">Court name</span><span id="tier-naming-price" class="tier-price">$100</span><span class="tier-desc">Rename the court</span>
        </button>
      </nav>

      <div id="demo-note" class="demo-note" hidden>Demo data · every brand shown is made up</div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
    </div>

    <div id="trailer-hint" class="trailer-hint" hidden>Trailer mode · press T or Esc to exit</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
